aid: oze
name: Oze
description: >-
  Oze is an African fintech platform on a mission to help small businesses grow, with a
  stated vision of building 100 million profitable businesses. Operating across Ghana,
  Nigeria, Rwanda, and Madagascar, Oze offers a Business App for bookkeeping, invoicing,
  inventory management, and online sales; no-collateral SME loans; and lending-management
  software that banks and microfinance institutions use to issue loans to small businesses.
  The company reports serving over 300,000 businesses. Oze is backed by Speedinvest and was
  added to the API Evangelist network as a portfolio lead. At the time of this enrichment
  pass Oze publishes no public developer API, SDK, developer portal, or API documentation.
